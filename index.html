<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d111b">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>Qwen3 Chat</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0d111b;
  --sidebar:#090d16;
  --surface:#151b29;
  --surface-2:#1b2232;
  --surface-hover:#222b3e;
  --border:#293247;
  --text:#eef1f8;
  --muted:#9aa4b8;
  --muted-2:#737f95;
  --purple:#b49aff;
  --purple-2:#8f70df;
  --purple-soft:rgba(180,154,255,.14);
  --font:Arial,"Noto Sans JP",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:var(--font)}
body{height:100dvh;overflow:hidden}
button,input,textarea{font:inherit}
button{cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.app{display:flex;width:100%;height:100dvh;overflow:hidden}

/* Sidebar */
.sidebar{width:260px;min-width:260px;height:100%;display:flex;flex-direction:column;background:var(--sidebar);padding:13px 12px 12px;border-right:1px solid rgba(255,255,255,.035);transition:width .2s,min-width .2s,transform .25s;z-index:30}
.sidebar.collapsed{width:0;min-width:0;padding-left:0;padding-right:0;overflow:hidden;border:0}
.sidebar-head{height:43px;display:flex;align-items:center;justify-content:space-between;padding:0 5px 0 8px;margin-bottom:17px}
.brand{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:650;letter-spacing:-.35px;white-space:nowrap}
.brand-mark{width:27px;height:27px;display:grid;place-items:center;flex:none}
.brand-mark svg{width:27px;height:27px;display:block}
.icon-btn{width:34px;height:34px;display:inline-grid;place-items:center;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:18px;flex:none}
.icon-btn:hover{background:var(--surface-hover);color:var(--text)}
.side-action{width:100%;height:39px;display:flex;align-items:center;gap:11px;padding:0 11px;border:1px solid transparent;border-radius:9px;background:transparent;color:#dfe4ef;text-align:left;font-size:13px;white-space:nowrap}
.side-action:hover{background:var(--surface-hover)}
.side-action .action-icon{width:19px;text-align:center;font-size:18px;color:#c4cad8}
.side-search{margin-top:4px}
.side-section-label{padding:25px 10px 9px;color:var(--muted-2);font-size:11px;font-weight:650;letter-spacing:.2px}
.chat-list{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:2px}
.chat-item{display:flex;align-items:center;gap:7px;width:100%;min-height:36px;padding:7px 9px;border:0;border-radius:8px;background:transparent;color:#cbd2e0;text-align:left;font-size:12px}
.chat-item:hover,.chat-item.active{background:#1a2232;color:#fff}
.chat-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.delete-chat{opacity:0;border:0;border-radius:5px;background:transparent;color:var(--muted);font-size:16px;padding:1px 5px}
.chat-item:hover .delete-chat{opacity:1}
.delete-chat:hover{background:#49313a;color:#ffb6c3}
.sidebar-bottom{padding-top:10px;border-top:1px solid rgba(255,255,255,.07)}
.profile{display:flex;align-items:center;gap:10px;padding:8px;border-radius:9px}
.profile:hover{background:var(--surface-hover)}
.profile-mark{width:32px;height:32px;display:grid;place-items:center;border-radius:9px;background:var(--purple-soft);color:var(--purple)}
.profile-mark svg{width:20px;height:20px}
.profile-copy{flex:1;min-width:0}
.profile-name{font-size:12px;font-weight:650}
.profile-sub{margin-top:3px;color:var(--muted);font-size:10px}

/* Main header */
.main{position:relative;display:flex;flex:1;min-width:0;height:100%;flex-direction:column;background:var(--bg)}
.topbar{height:56px;min-height:56px;display:flex;align-items:center;gap:9px;padding:0 20px;background:rgba(13,17,27,.92)}
.top-title{font-size:14px;font-weight:650;letter-spacing:-.2px}
.title-chevron{font-size:13px;color:var(--muted);margin-left:2px}
.top-spacer{flex:1}
.model-status{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px;margin-right:8px}
.status-dot{width:7px;height:7px;border-radius:50%;background:#a58b59}
.status-dot.ready{background:#8ed5a0;box-shadow:0 0 8px #8ed5a066}
.model-button{height:32px;padding:0 11px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:#e5e9f2;font-size:11px}
.model-button:hover{background:var(--surface-hover)}
.model-button:disabled{opacity:.55;cursor:wait}

/* Conversation */
.messages{flex:1;min-height:0;overflow-y:auto;padding:24px 24px 28px;scroll-behavior:smooth}
.message-area{width:100%;max-width:768px;margin:0 auto}
.welcome{min-height:calc(100% - 10px);min-height:58vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:35px 12px}
.welcome-mark{width:43px;height:43px;margin-bottom:23px}
.welcome-mark svg{width:100%;height:100%}
.welcome h1{margin:0 0 11px;font-size:clamp(23px,3vw,29px);font-weight:600;letter-spacing:-.9px}
.welcome p{margin:0;color:var(--muted);font-size:13px;line-height:1.8}
.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;width:min(100%,490px);margin-top:29px}
.suggestion{min-height:58px;padding:11px 13px;border:1px solid var(--border);border-radius:12px;background:rgba(21,27,41,.72);color:#d8deeb;text-align:left;font-size:12px;line-height:1.5}
.suggestion:hover{background:var(--surface-hover);border-color:#46516a}
.message{display:flex;gap:14px;margin:0 auto 25px;line-height:1.85;font-size:14px;overflow-wrap:anywhere;white-space:pre-wrap}
.message.user{justify-content:flex-end}
.message-avatar{display:none}
.message-content{min-width:0;max-width:100%;padding-top:2px}
.message.user .message-content{max-width:min(82%,620px);padding:10px 15px;border-radius:18px;background:#222b3d;color:#f3f5fb}
.message.assistant .message-content{width:100%;color:#e6eaf3}
.message.assistant .message-content p{margin:0}
.loading-text{color:#b9a9e8!important;animation:pulse 1.3s infinite}
@keyframes pulse{50%{opacity:.45}}

/* Composer */
.composer-wrap{flex:none;padding:12px 22px 18px;background:linear-gradient(180deg,rgba(13,17,27,0),var(--bg) 18%)}
.composer{width:100%;max-width:768px;margin:0 auto;padding:10px 12px 9px 16px;border:1px solid #39445a;border-radius:24px;background:#171e2d;box-shadow:0 8px 30px rgba(0,0,0,.16);transition:border-color .2s,box-shadow .2s}
.composer:focus-within{border-color:#8871c7;box-shadow:0 0 0 3px rgba(180,154,255,.09)}
textarea{display:block;width:100%;min-height:42px;max-height:170px;resize:none;outline:none;border:0;background:transparent;color:var(--text);font-size:14px;line-height:1.6;padding:8px 2px}
textarea::placeholder{color:#8994aa}
.composer-bottom{display:flex;align-items:center;gap:8px;min-height:34px}
.composer-hint{color:var(--muted-2);font-size:10px;padding-left:3px}
.spacer{flex:1}
.send-button{width:34px;height:34px;display:grid;place-items:center;border:0;border-radius:50%;background:var(--purple);color:#171323;font-size:20px;font-weight:700;transition:.15s}
.send-button:hover{background:#c8b7ff;transform:translateY(-1px)}
.send-button:disabled{background:#55516a;color:#aaa4bd;cursor:not-allowed;transform:none}
.hint{text-align:center;margin-top:9px;color:#737f94;font-size:10px}
.mobile-overlay{display:none}

/* Mobile */
@media(max-width:760px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:275px;min-width:275px;transform:translateX(-105%);box-shadow:12px 0 38px #0008}
  .sidebar.mobile-open{transform:translateX(0)}
  .sidebar.collapsed{width:275px;min-width:275px;padding:13px 12px 12px;transform:translateX(-105%)}
  .mobile-overlay.open{display:block;position:fixed;inset:0;z-index:25;background:#0009}
  .topbar{height:52px;min-height:52px;padding:0 10px}
  .messages{padding:17px 14px 22px}
  .composer-wrap{padding:8px 10px 12px}
  .welcome{min-height:52vh}
  .welcome h1{font-size:22px}
  .suggestions{grid-template-columns:1fr;width:min(100%,390px);margin-top:22px}
  .suggestion{min-height:47px}
  .model-status{font-size:10px;margin-right:0}
  .model-button{padding:0 8px;font-size:10px}
  .message{font-size:13px}
  .message.user .message-content{max-width:90%}
}
@media(max-width:390px){.model-status{display:none}.topbar{gap:5px}.top-title{font-size:13px}}

/* Practical controls and settings */
.composer-tools{display:flex;align-items:center;gap:5px}
.tool-btn{height:31px;padding:0 9px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--muted);font-size:11px}
.tool-btn:hover{background:var(--surface-hover);color:var(--text)}
.tool-btn svg{width:16px;height:16px;vertical-align:middle;margin-right:4px;stroke:currentColor;fill:none;stroke-width:1.7}
.top-icon-action{height:32px;padding:0 9px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--muted);font-size:11px}
.top-icon-action:hover{background:var(--surface-hover);color:var(--text)}
.dialog-backdrop{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.58);display:flex;align-items:center;justify-content:center;padding:16px}
.dialog-backdrop[hidden]{display:none}
.dialog{width:min(760px,100%);max-height:min(86vh,820px);overflow:hidden;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:17px;box-shadow:0 24px 90px #0008}
.dialog-head{height:58px;min-height:58px;padding:0 20px;display:flex;align-items:center;border-bottom:1px solid var(--border);font-size:15px;font-weight:650}
.dialog-close{margin-left:auto;border:0;background:transparent;color:var(--muted);font-size:23px;width:34px;height:34px;border-radius:8px}
.dialog-close:hover{background:var(--surface-hover)}
.dialog-body{display:flex;min-height:0;overflow:auto}
.settings-nav{width:190px;flex:none;padding:13px;border-right:1px solid var(--border)}
.settings-tab{width:100%;height:38px;border:0;border-radius:8px;background:transparent;color:var(--muted);text-align:left;padding:0 10px;font-size:12px}
.settings-tab.active,.settings-tab:hover{background:var(--surface-hover);color:var(--text)}
.settings-content{flex:1;min-width:0;padding:20px 23px;overflow:auto}
.settings-pane[hidden]{display:none}
.settings-pane h3{font-size:14px;margin:0 0 6px}
.settings-desc{font-size:11px;color:var(--muted);line-height:1.65;margin:0 0 18px}
.setting-row{padding:13px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:18px}
.setting-copy{flex:1;min-width:0}
.setting-title{font-size:12px;font-weight:600}
.setting-help{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.5}
.setting-control{min-width:145px;max-width:230px}
.setting-control input[type="text"],.setting-control input[type="number"],.setting-control select,.setting-control textarea,.search-input{width:100%;padding:8px 9px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:11px}
.setting-control input[type="range"]{width:100%;accent-color:var(--purple)}
.setting-control textarea{min-height:90px;resize:vertical;line-height:1.5}
.setting-control input[type="checkbox"]{accent-color:var(--purple);width:17px;height:17px}
.primary-small,.danger-small{border:0;border-radius:8px;padding:8px 12px;background:var(--purple);color:#171323;font-size:11px;font-weight:650}
.danger-small{background:#7d3547;color:white}
.secondary-small{border:1px solid var(--border);border-radius:8px;padding:8px 12px;background:var(--surface-2);color:var(--text);font-size:11px}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;padding:13px 20px;border-top:1px solid var(--border)}
.search-dialog-content{padding:18px;display:flex;flex-direction:column;gap:12px}
.search-results{max-height:55vh;overflow:auto}
.search-result{padding:11px;border-radius:8px;cursor:pointer;font-size:12px;border-bottom:1px solid var(--border)}
.search-result:hover{background:var(--surface-hover)}
.file-preview-list{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 7px}
.file-preview{display:flex;align-items:center;gap:6px;padding:5px 8px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);font-size:10px;color:var(--muted)}
.file-preview button{border:0;background:none;color:var(--muted);font-size:14px}
.toast-message{position:fixed;z-index:150;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 15px;font-size:12px;box-shadow:0 8px 30px #0005}
.toast-message[hidden]{display:none}
html[data-theme="light"]{
 color-scheme:light;--bg:#fff;--sidebar:#f9f9fa;--surface:#fff;--surface-2:#f5f5f6;
 --surface-hover:#ededf0;--border:#e2e2e5;--text:#202124;--muted:#777b84;
 --muted-2:#92959c;--purple:#8d6ad8;--purple-2:#7654c4;--purple-soft:rgba(141,106,216,.12);
}
html[data-theme="light"] .topbar{background:rgba(255,255,255,.94)}
html[data-theme="light"] .composer{background:#fff;border-color:#dedee3}
html[data-theme="light"] .message.user .message-content{background:#f1eff6;color:#202124}
html[data-theme="light"] .message.assistant .message-content{color:#202124}
html[data-theme="light"] .chat-item{color:#41434a}
html[data-theme="light"] .chat-item:hover,html[data-theme="light"] .chat-item.active{background:#eceaf1;color:#171717}
@media(max-width:620px){
 .dialog-body{display:block}.settings-nav{width:100%;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--border);padding:8px;gap:5px}
 .settings-tab{width:auto;white-space:nowrap;padding:0 12px}
 .settings-content{padding:15px}
 .setting-row{align-items:flex-start;flex-direction:column;gap:9px}
 .setting-control{width:100%;max-width:none}
 .composer-tools{gap:0}.tool-btn{padding:0 6px;font-size:10px}
}


/* Screenshot-aligned ChatGPT-like layout: custom implementation, not copied site source */
:root{
 --bg:#ffffff;--sidebar:#f9f9f9;--surface:#ffffff;--surface-2:#f4f4f4;
 --surface-hover:#eeeeef;--border:#e5e5e5;--text:#202123;--muted:#777777;
 --muted-2:#999999;--purple:#8b6bd6;--purple-2:#7553c5;--purple-soft:rgba(139,107,214,.12);
 --font:Arial,"Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
 color-scheme:light;
}
html,body{font-family:Arial,"Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
.sidebar{width:340px;min-width:340px;padding:12px 6px 8px;background:#fafafa;border-right:1px solid #e5e5e5}
.sidebar-head{height:54px;margin:0 4px 12px;padding:0 10px}
.brand{font-size:17px;font-weight:650;color:#202123;gap:0}
.brand-mark{display:none}
#collapseSidebar{color:#777}
.side-action{height:37px;border-radius:8px;padding:0 11px;gap:10px;font-size:14px;color:#252525}
.side-action .action-icon{width:20px;font-size:17px;color:#333}
.side-section-label{padding:25px 10px 9px;font-size:12px;font-weight:400;color:#8a8a8a}
.chat-list{flex:1;min-height:50px;max-height:34%;overflow:auto}
.chat-item{min-height:36px;border-radius:8px;font-size:13px;color:#303030;padding:7px 10px}
.chat-item:hover,.chat-item.active{background:#ededed;color:#202123}
.sidebar-bottom{margin-top:auto;background:#fafafa}
.profile{min-height:48px;border-radius:8px;padding:7px 8px}
.profile-mark{width:28px;height:28px;border-radius:50%;background:#f1eafa}
.profile-name{font-size:13px}
.profile-sub{font-size:11px}
.main{background:#fff}
.topbar{height:58px;min-height:58px;padding:0 24px;background:#fff;gap:12px}
.title-button{border:0;background:transparent;padding:6px 4px;cursor:pointer}
.top-title{font-size:14px;font-weight:550;color:#202123}
.title-chevron{font-size:12px}
.model-status{font-size:11px;color:#777}
.top-icon-action{border:0;background:transparent;color:#333;font-size:13px;height:34px}
.top-icon-action:hover{background:#f0f0f0}
.model-button{height:34px;border:1px solid #dedede;border-radius:18px;background:#fff;color:#333;font-size:12px}
.messages{padding:0 24px 18px;background:#fff}
.message-area{max-width:768px}
.welcome{min-height:calc(100% - 4px);min-height:64vh;padding:20px 10px;justify-content:center}
.welcome-mark{display:none}
.welcome h1{font-size:27px;font-weight:500;letter-spacing:-.6px;margin:0 0 26px;color:#202123}
.welcome p{display:none}
.suggestions{display:none}
.message{font-size:15px;line-height:1.8;margin-bottom:24px}
.message.user .message-content{background:#f4f4f4;color:#202123;border-radius:20px;padding:10px 16px}
.message.assistant .message-content{color:#202123}
.composer-wrap{padding:0 22px 24px;background:#fff}
.composer{max-width:768px;min-height:54px;padding:5px 9px 5px 8px;border:1px solid #e3e3e3;border-radius:28px;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.06);display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;column-gap:4px}
.composer:focus-within{border-color:#d4d4d4;box-shadow:0 2px 16px rgba(0,0,0,.08)}
.composer-plus{width:36px;height:36px;border:0;border-radius:50%;background:#f1f1f1;color:#222;font-size:26px;font-weight:300;line-height:1}
.composer-plus:hover{background:#e7e7e7}
.composer textarea{grid-column:2;grid-row:1;min-height:40px;max-height:150px;padding:9px 4px;font-size:15px;color:#202123;align-self:center}
.composer textarea::placeholder{color:#8b8b8b}
.composer-inline-actions{grid-column:3;grid-row:1;display:flex;align-items:center;gap:5px}

.inline-tool:hover{background:#f3f3f3}
.mic-tool{font-size:18px;width:32px;padding:0}
.composer-send{width:36px;height:36px;border:0;border-radius:50%;background:#2864cf;color:#fff;font-size:19px;display:grid;place-items:center}
.composer-send:disabled{background:#2864cf;color:#fff;opacity:.9}
.file-preview-list{grid-column:1/-1;grid-row:2;display:flex;flex-wrap:wrap}

.dialog{background:#fff;color:#202123}
.dialog-head{border-color:#e5e5e5}
.settings-nav{border-color:#e5e5e5}

.setting-help,.settings-desc{color:#777}

html[data-theme="dark"]{
 color-scheme:dark;--bg:#0b1020;--sidebar:#080d19;--surface:#131a2a;--surface-2:#1a2234;
 --surface-hover:#232d42;--border:#2a354b;--text:#eef1f8;--muted:#a0a9ba;--muted-2:#78849a;
 --purple:#b49aff;--purple-2:#8f70df;--purple-soft:rgba(180,154,255,.14);
}
html[data-theme="dark"] .sidebar,html[data-theme="dark"] .sidebar-bottom{background:var(--sidebar);border-color:var(--border)}
html[data-theme="dark"] .brand,html[data-theme="dark"] .side-action,html[data-theme="dark"] .chat-item{color:var(--text)}
html[data-theme="dark"] .main,html[data-theme="dark"] .topbar,html[data-theme="dark"] .messages,html[data-theme="dark"] .composer-wrap{background:var(--bg)}
html[data-theme="dark"] .composer{background:var(--surface);border-color:var(--border)}
html[data-theme="dark"] .composer textarea,html[data-theme="dark"] .message.assistant .message-content{color:var(--text)}
html[data-theme="dark"] .composer textarea::placeholder{color:var(--muted)}
html[data-theme="dark"] .welcome h1{color:var(--text)}
html[data-theme="dark"] .message.user .message-content{background:var(--surface-2);color:var(--text)}
html[data-theme="dark"] .dialog{background:var(--surface);color:var(--text)}
html[data-theme="dark"] .setting-control input,html[data-theme="dark"] .setting-control select,html[data-theme="dark"] .setting-control textarea,html[data-theme="dark"] .search-input{background:var(--bg);color:var(--text);border-color:var(--border)}
@media(max-width:760px){
 .sidebar{width:275px;min-width:275px}
 .composer-wrap{padding:8px 10px 14px}
 .composer{grid-template-columns:36px minmax(0,1fr) auto}
 .inline-tool{padding:0 4px}
 .mic-tool{display:none}
 .topbar{padding:0 10px}
 .model-status{display:none}
}


/* Monochrome ChatGPT-inspired palette */
:root{
  --bg:#ffffff;--sidebar:#f9f9f9;--surface:#ffffff;--surface-2:#f4f4f4;
  --surface-hover:#ededed;--border:#e5e5e5;--text:#212121;--muted:#777777;
  --muted-2:#999999;--purple:#555555;--purple-2:#333333;--purple-soft:rgba(0,0,0,.07);
  color-scheme:light;
}
html[data-theme="light"]{
  --bg:#ffffff;--sidebar:#f9f9f9;--surface:#ffffff;--surface-2:#f4f4f4;
  --surface-hover:#ededed;--border:#e5e5e5;--text:#212121;--muted:#777777;
  --muted-2:#999999;--purple:#555555;--purple-2:#333333;--purple-soft:rgba(0,0,0,.07);
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#212121;--sidebar:#171717;--surface:#2f2f2f;--surface-2:#383838;
  --surface-hover:#424242;--border:#454545;--text:#f5f5f5;--muted:#b4b4b4;
  --muted-2:#8b8b8b;--purple:#d0d0d0;--purple-2:#eeeeee;--purple-soft:rgba(255,255,255,.09);
}
html[data-theme="light"] .topbar{background:rgba(255,255,255,.94)}
html[data-theme="light"] .message.user .message-content{background:#f0f0f0;color:#212121}
html[data-theme="light"] .chat-item:hover,html[data-theme="light"] .chat-item.active{background:#ededed;color:#171717}
html[data-theme="dark"] .message.user .message-content{background:#383838;color:#f5f5f5}
html[data-theme="dark"] .composer{background:#2f2f2f;border-color:#555}
html[data-theme="dark"] .composer:focus-within{border-color:#888;box-shadow:0 0 0 3px rgba(255,255,255,.06)}
html[data-theme="dark"] .send-button{background:#f1f1f1;color:#171717}
html[data-theme="dark"] .send-button:hover{background:#fff}
html[data-theme="dark"] .send-button:disabled{background:#555;color:#aaa}
html[data-theme="dark"] .chat-item:hover,html[data-theme="dark"] .chat-item.active{background:#383838;color:#fff}
html[data-theme="dark"] .welcome h1,html[data-theme="dark"] .message.assistant .message-content{color:#f5f5f5}
html[data-theme="dark"] .suggestion{background:#2b2b2b;color:#e8e8e8;border-color:#444}
html[data-theme="dark"] .suggestion:hover{background:#383838;border-color:#666}
html[data-theme="dark"] .primary-small{background:#e5e5e5;color:#171717}
html[data-theme="dark"] .profile-mark{background:#383838;color:#eee}


/* Minimal sidebar: new chat, pinned chats, and conversation history */
.side-section-label{padding:18px 10px 7px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:0}
.pinned-list{flex:0 0 auto;max-height:34vh}
.history-heading{padding-top:20px}
.chat-list{gap:2px}
.chat-item{min-height:38px;font-size:13px;padding:7px 9px}
.chat-item .pin-chat,.chat-item .delete-chat{opacity:0;flex:none;border:0;background:transparent;color:var(--muted);border-radius:6px;padding:3px 5px;font-size:14px;cursor:pointer}
.chat-item:hover .pin-chat,.chat-item:hover .delete-chat,.chat-item.active .pin-chat{opacity:1}
.chat-item .pin-chat.pinned{opacity:1;color:var(--text)}
.chat-item .pin-chat:hover,.chat-item .delete-chat:hover{background:var(--surface-hover);color:var(--text)}

@media (hover:none){.chat-item .pin-chat,.chat-item .delete-chat{opacity:.75}.chat-item .pin-chat.pinned{opacity:1}}

/* Final clean ChatGPT-inspired layout: only features implemented by this offline app */
:root{
  --bg:#ffffff;--sidebar:#f9f9f9;--surface:#ffffff;--surface-2:#f4f4f4;
  --surface-hover:#ececec;--border:#e5e5e5;--text:#212121;--muted:#777;
  --muted-2:#999;--purple:#333;--purple-2:#222;--purple-soft:rgba(0,0,0,.07);
  color-scheme:light;
}

<body>
<div class="app">
  <div class="mobile-overlay" id="overlay"></div>

    </div>

    <div class="chat-list pinned-list" id="pinnedList"></div>

    <div class="chat-list" id="chatList"></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn mobile-menu" id="mobileMenu" title="メニュー" aria-label="メニュー">☰</button>

    </header>

      <div class="message-area" id="messageArea"></div>
    </section>

        </div>

      </div>

<script type="module">
import { pipeline, env } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2";

const MODEL_OPTIONS = {
  "0.6B": { id: "onnx-community/Qwen3-0.6B-ONNX", label: "Qwen3 0.6B", dtype: "q4f16", size: "約543MB（モデル本体の目安）" },
  "4B": { id: "onnx-community/Qwen3-4B-ONNX", label: "Qwen3 4B", dtype: undefined, size: "約3.08GB（モデル本体の目安）" }
};
let selectedModelKey = localStorage.getItem("qwen3-selected-model") || "0.6B";
if (!MODEL_OPTIONS[selectedModelKey]) selectedModelKey = "0.6B";
let loadedModelKey = null;
const $ = id => document.getElementById(id);
let generator = null;
let busy = false;
let conversations = [];
let currentId = null;

env.useBrowserCache = true;
env.useWasmCache = true;

function createId(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}
function setStatus(message,ready=false){
  const statusText=$("statusText");
  if(statusText) statusText.textContent=message;
  const topStatus=$("topStatus");
  if(topStatus) topStatus.textContent=ready?"準備完了":message;
  const statusDot=$("statusDot");
  if(statusDot) statusDot.classList.toggle("ready",ready);
}
function getCurrent(){return conversations.find(c=>c.id===currentId)}
function saveConversations(){
  try{localStorage.setItem("qwen3-chat-conversations",JSON.stringify(conversations))}
  catch(e){setStatus("会話の保存に失敗しました")}
}
function makeConversation(){
  const active=getCurrent();
  // Do not create another empty draft when the current chat is already empty.
  if(active && active.messages.length===0){currentId=active.id;renderAll();return}
  // Empty drafts are temporary and must never accumulate in history.
  conversations=conversations.filter(c=>Array.isArray(c.messages)&&c.messages.length>0);
  const chat={id:createId(),title:"新しいチャット",messages:[],updated:Date.now(),pinned:false};
  conversations.unshift(chat);currentId=chat.id;saveConversations();renderAll();
}
function markSvg(){
  return `<svg viewBox="0 0 100 100" fill="none" aria-hidden="true"><g stroke="#555555" stroke-width="7.5" stroke-linecap="round"><path d="M50 5L50 29"/><path d="M50 71L50 95"/><path d="M5 50L29 50"/><path d="M71 50L95 50"/><path d="M18.2 18.2L35.2 35.2"/><path d="M64.8 64.8L81.8 81.8"/><path d="M81.8 18.2L64.8 35.2"/><path d="M35.2 64.8L18.2 81.8"/><path d="M31 8L40 30"/><path d="M60 70L69 92"/><path d="M8 69L30 60"/><path d="M70 40L92 31"/></g></svg>`;
}
function makeWelcome(){
  return `<div class="welcome">
    <div class="welcome-mark">${markSvg()}</div>
    <h1>今日は何をしましょうか？</h1>
    <p>Qwen3と自由に会話しましょう。<br>あなた専用のローカルAIアシスタントです。</p>
    <div class="suggestions">
      <button class="suggestion" data-prompt="Pythonを初心者向けに教えて">⌘　プログラミングを学ぶ</button>
      <button class="suggestion" data-prompt="面白い科学の雑学を教えて">✧　科学の雑学</button>
      <button class="suggestion" data-prompt="今日の勉強計画を考えて">▤　勉強を手伝って</button>
      <button class="suggestion" data-prompt="アイデアを一緒に考えて">✎　アイデアを考える</button>
    </div>
  </div>`;
}
function renderMessages(){
  const chat=getCurrent(),area=$("messageArea");
  area.innerHTML="";
  if(!chat||chat.messages.length===0){
    area.innerHTML=makeWelcome();
    area.querySelectorAll("[data-prompt]").forEach(button=>button.addEventListener("click",()=>{
      $("prompt").value=button.dataset.prompt;$("prompt").focus();resizePrompt();
    }));
    return;
  }
  for(const item of chat.messages)addMessageElement(item.role,item.content);
  scrollBottom();
}
function addMessageElement(role,content){
  const row=document.createElement("div");row.className="message "+role;

  row.append(text);$("messageArea").append(row);return text;
}
function scrollBottom(){$("messages").scrollTop=$("messages").scrollHeight}
function renderSidebar(){
  const pinnedList=$("pinnedList"),list=$("chatList");
  pinnedList.innerHTML="";list.innerHTML="";
  const sorted=[...conversations]
    .filter(c=>Array.isArray(c.messages)&&c.messages.length>0)
    .sort((a,b)=>(b.updated||0)-(a.updated||0));
  const pinned=sorted.filter(c=>c.pinned);
  const history=sorted.filter(c=>!c.pinned);
  $("pinnedHeading").hidden=pinned.length===0;
  pinnedList.hidden=pinned.length===0;
  function addChatRow(chat,target){
    const row=document.createElement("div");
    row.className="chat-item"+(chat.id===currentId?" active":"");
    const title=document.createElement("span");
    title.className="chat-title";title.textContent=chat.title||"新しいチャット";
    const pin=document.createElement("button");
    pin.className="pin-chat"+(chat.pinned?" pinned":"");
    pin.type="button";pin.textContent=chat.pinned?"★":"☆";
    pin.title=chat.pinned?"ピン留めを解除":"ピン留め";
    pin.setAttribute("aria-label",pin.title);
    pin.addEventListener("click",e=>{
      e.stopPropagation();if(busy)return;
      chat.pinned=!chat.pinned;saveConversations();renderSidebar();
    });
    const remove=document.createElement("button");
    remove.className="delete-chat";remove.type="button";remove.textContent="×";
    remove.title="会話を削除";remove.setAttribute("aria-label","会話を削除");
    remove.addEventListener("click",e=>{
      e.stopPropagation();if(busy)return;
      conversations=conversations.filter(c=>c.id!==chat.id);
      if(currentId===chat.id){
        currentId=conversations[0]?.id||null;
        if(!currentId){makeConversation();return}
      }
      saveConversations();renderAll();
    });
    row.append(title,pin,remove);
    row.addEventListener("click",()=>{
      if(busy)return;currentId=chat.id;renderAll();closeMobileSidebar();
    });
    target.append(row);
  }
  pinned.forEach(chat=>addChatRow(chat,pinnedList));
  history.forEach(chat=>addChatRow(chat,list));
}
function renderAll(){renderSidebar();renderMessages()}

  const node=$("modelChooserBackdrop");
  if(node)node.remove();
}
function openModelChooser(){
  if(busy){toast("処理中はモデルを切り替えられません");return}
  closeModelChooser();
  const backdrop=document.createElement("div");backdrop.id="modelChooserBackdrop";backdrop.className="model-chooser-backdrop";
  const dialog=document.createElement("section");dialog.className="model-chooser";dialog.setAttribute("role","dialog");dialog.setAttribute("aria-modal","true");dialog.setAttribute("aria-labelledby","modelChooserTitle");
  const current=loadedModelKey?`現在使用中：Qwen3 ${loadedModelKey}`:"まだモデルは読み込まれていません";
  dialog.innerHTML=`<h2 id="modelChooserTitle">使用するAIモデル</h2>
    <p class="chooser-sub">${current}<br>初回はモデルデータをダウンロードします。次回以降はブラウザのキャッシュが残っていれば再利用できます。</p>
    <label class="model-choice"><input type="radio" name="qwenModel" value="0.6B" ${selectedModelKey==="0.6B"?"checked":""}><span><strong>Qwen3 0.6B — 軽量・おすすめ</strong><small>モデル本体 約543MB。メモリ負担を抑えたい端末向け。4Bより回答能力は控えめです。</small></span></label>
    <label class="model-choice"><input type="radio" name="qwenModel" value="4B" ${selectedModelKey==="4B"?"checked":""}><span><strong>Qwen3 4B — 高性能</strong><small>モデル本体 約3.08GB。より高いメモリ・GPU性能が必要です。Chromebookではクラッシュする可能性があります。</small></span></label>
    <div class="chooser-warning">4BはLinux環境なしで、ChromeのWebGPUを使って動かします。ただし、端末のRAM/GPUメモリが足りない場合はブラウザが終了することがあります。ダウンロード容量と実行時に必要なメモリは同じではありません。</div>
    <div class="chooser-actions"><button type="button" data-action="cancel">キャンセル</button><button type="button" class="primary" data-action="start">このモデルを読み込む</button></div>
    <p class="chooser-foot">モデルの切り替え後も、以前のモデルのキャッシュが残っていれば再ダウンロードを省けます。ブラウザがキャッシュを削除した場合は再取得が必要です。</p>`;
  backdrop.append(dialog);document.body.append(backdrop);
  backdrop.addEventListener("click",e=>{if(e.target===backdrop)closeModelChooser()});
  dialog.querySelector('[data-action="cancel"]').addEventListener("click",closeModelChooser);
  dialog.querySelector('[data-action="start"]').addEventListener("click",()=>{
    const chosen=dialog.querySelector('input[name="qwenModel"]:checked')?.value||"0.6B";
    closeModelChooser();loadSelectedModel(chosen);
  });
}
async function loadModel(){openModelChooser()}
async function loadSelectedModel(modelKey){
  if(busy)return;
  if(!MODEL_OPTIONS[modelKey])throw new Error("未対応のモデルです");
  if(generator&&loadedModelKey===modelKey){toast("このモデルはすでに読み込み済みです");return}
  busy=true;selectedModelKey=modelKey;localStorage.setItem("qwen3-selected-model",modelKey);
  const config=MODEL_OPTIONS[modelKey];
  $("loadModel").disabled=true;$("loadModel").textContent="切り替え中...";
  $("send").disabled=true;
  setStatus(`Qwen3 ${modelKey} の準備をしています...`);
  try{
    if(!navigator.gpu)throw new Error("このブラウザではWebGPUが利用できません。Chromeの対応状況を確認してください。");
    const adapter=await navigator.gpu.requestAdapter();
    if(!adapter)throw new Error("GPUアダプターが見つかりません。WebGPU対応端末が必要です。");
    if(navigator.storage?.persist)await navigator.storage.persist();
    // Release the old model before allocating another one to reduce peak memory usage.
    if(generator){
      try{if(typeof generator.dispose==="function")await generator.dispose();}catch(e){console.warn("旧モデルの解放に失敗:",e)}
      generator=null;loadedModelKey=null;
      await new Promise(resolve=>setTimeout(resolve,250));
    }
    const memoryGB=Number(navigator.deviceMemory||0);
    if(modelKey==="4B"){
      setStatus(memoryGB&&memoryGB<=4?"注意：推定RAMが少ない端末です。4B読み込みでChromeが終了する可能性があります。":"Qwen3 4Bを読み込んでいます...");
    }else setStatus("Qwen3 0.6Bを読み込んでいます...");
    const options={device:"webgpu",progress_callback:p=>{
      if(p.status==="progress"&&p.file){const percent=p.progress?Math.round(p.progress):0;setStatus(`Qwen3 ${modelKey} ダウンロード中：${p.file} ${percent}%`)}
      else if(p.status)setStatus(`Qwen3 ${modelKey} 準備中：${p.status}`);
    }};
    // 0.6B explicitly uses the published q4f16 WebGPU variant. The 4B repo
    // provides its own WebGPU INT4 optimized files, so let Transformers.js resolve them.
    if(config.dtype)options.dtype=config.dtype;
    generator=await pipeline("text-generation",config.id,options);
    loadedModelKey=modelKey;
    setStatus(`Qwen3 ${modelKey} 読み込み完了`,true);
    $("send").disabled=false;$("loadModel").textContent=`Qwen3 ${modelKey} ▾`;
  }catch(error){
    generator=null;loadedModelKey=null;
    setStatus("読み込みエラー："+error.message);
    $("loadModel").disabled=false;$("loadModel").textContent="モデルを選択";
    toast("モデルを読み込めませんでした。軽量な0.6Bを試すか、他のタブを閉じてください。");
  }finally{
    busy=false;$("loadModel").disabled=false;
    if(!generator)$("loadModel").textContent="モデルを読み込む";
  }
}
async function sendMessage(){
  const text=$("prompt").value.trim();
  if(!text||!generator||busy)return;
  if(!currentId||!getCurrent())makeConversation();
  const chat=getCurrent();
  $("prompt").value="";resizePrompt();
  chat.messages.push({role:"user",content:text});
  if(chat.messages.length===1)chat.title=text.slice(0,24)+(text.length>24?"...":"");
  chat.updated=Date.now();saveConversations();renderAll();
  const answerBox=addMessageElement("assistant","考えています...");
  answerBox.classList.add("loading-text");
  $("send").disabled=true;busy=true;setStatus("回答を生成しています...");
  try{
    const messages=[
      {role:"system",content:(JSON.parse(localStorage.getItem("qwen3-app-settings")||"{}").systemPrompt)||"あなたは親切で正確な日本語AIアシスタントです。不明なことは不明と伝えてください。"},
      ...chat.messages.slice(loadedModelKey==="4B"?-4:-8).map(item=>({role:item.role,content:loadedModelKey==="4B"?String(item.content).slice(-1400):item.content}))
    ];
    const requestedTokens=Math.max(64,Math.min(2048,Number(JSON.parse(localStorage.getItem("qwen3-app-settings")||"{}").maxTokens)||512));
    const safeTokenLimit=loadedModelKey==="4B"?Math.min(requestedTokens,160):Math.min(requestedTokens,384);
    const result=await generator(messages,{max_new_tokens:safeTokenLimit,temperature:Math.max(0,Math.min(1.5,Number(JSON.parse(localStorage.getItem("qwen3-app-settings")||"{}").temperature??0.7))),do_sample:true});
    let answer=result[0].generated_text;
    if(Array.isArray(answer))answer=answer[answer.length-1]?.content??"";
    answer=String(answer).replace(/<think>[\s\S]*?<\/think>/g,"").trim();
    if(!answer)answer="回答を生成できませんでした。";
    answerBox.classList.remove("loading-text");answerBox.textContent=answer;
    chat.messages.push({role:"assistant",content:answer});chat.updated=Date.now();
    saveConversations();renderSidebar();setStatus("準備完了",true);
    if(JSON.parse(localStorage.getItem("qwen3-app-settings")||"{}").autoSpeak && "speechSynthesis" in window){const u=new SpeechSynthesisUtterance(answer);u.lang="ja-JP";speechSynthesis.speak(u)}
  }catch(error){
    answerBox.classList.remove("loading-text");answerBox.textContent="エラーが発生しました："+error.message;setStatus("生成エラー");
  }finally{busy=false;$("send").disabled=!generator;$("prompt").focus();scrollBottom()}
}

try{

if(conversations.length>0)currentId=conversations.sort((a,b)=>(b.updated||0)-(a.updated||0))[0].id;

const appSettingsDefaults={
  theme:"light",accent:"mono",fontScale:"15",enterBehavior:"enter",
  autoSpeak:false,maxTokens:512,temperature:0.7,
  systemPrompt:"あなたは親切で正確な日本語AIアシスタントです。不明なことは不明と伝えてください。"
};
let appSettings={...appSettingsDefaults};
let attachedFiles=[];
let speechRecognition=null;
function toast(message){
  const node=$("toastMessage");node.textContent=message;node.hidden=false;
  clearTimeout(toast.timer);toast.timer=setTimeout(()=>node.hidden=true,3200);
}
function loadAppSettings(){

function applyTheme(){
  document.documentElement.dataset.theme="light";
  document.documentElement.style.setProperty("--purple","#333333");
  document.documentElement.style.setProperty("--purple-2","#222222");
  const area=$("messageArea");if(area)area.style.fontSize="15px";
}
function downloadJSON(name,data){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);const a=document.createElement("a");
  a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function exportCurrentConversation(){
  const chat=getCurrent();if(!chat){toast("書き出す会話がありません");return}
  downloadJSON("qwen3-chat-"+chat.title.replace(/[\\/:*?"<>|]/g,"_").slice(0,40)+".json",chat);
}
function renderAttachedFiles(){
  const box=$("filePreviewList");box.innerHTML="";
  attachedFiles.forEach((f,i)=>{const chip=document.createElement("span");chip.className="file-preview";chip.textContent=f.name;
    const x=document.createElement("button");x.textContent="×";x.title="添付を削除";x.onclick=()=>{attachedFiles.splice(i,1);renderAttachedFiles()};chip.append(x);box.append(chip)});
}
async function readAttachments(){
  const extracted=[];
  for(const f of attachedFiles){
    if(f.size>5*1024*1024){extracted.push(`[添付ファイル ${f.name}: 5MBを超えるため本文への展開を省略]`);continue}
    if(/\.(txt|md|csv|json|js|py|html|css|xml|log|yaml|yml)$/i.test(f.name)||f.type.startsWith("text/")){
      try{extracted.push(`【添付ファイル: ${f.name}】\n${(await f.text()).slice(0,60000)}`)}catch{extracted.push(`[${f.name}: 読み込みに失敗]`)}
    }else{
      extracted.push(`[添付ファイル: ${f.name}。このQwen3-4Bテキストモデルでは画像・PDF等の内容解析はできません。]`);
    }
  }
  return extracted.join("\n\n");
}
async function sendWithAttachments(){
  const prompt=$("prompt").value.trim();
  if(!prompt&&!attachedFiles.length)return;
  if(!generator){toast("先にQwen3モデルを読み込んでください");return}
  const attachmentText=await readAttachments();
  const combined=[prompt,attachmentText].filter(Boolean).join("\n\n");
  attachedFiles=[];renderAttachedFiles();$("prompt").value="";resizePrompt();
  $("prompt").value=combined;
  await sendMessage();
}
function startVoiceInput(){
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRecognition){toast("このブラウザは音声認識に対応していません");return}
  if(speechRecognition){speechRecognition.stop();speechRecognition=null;return}
  speechRecognition=new SpeechRecognition();speechRecognition.lang="ja-JP";
  speechRecognition.interimResults=true;speechRecognition.continuous=false;
  speechRecognition.onresult=e=>{
    let text="";for(let i=e.resultIndex;i<e.results.length;i++)text+=e.results[i][0].transcript;
    $("prompt").value=text;resizePrompt();
  };
  speechRecognition.onerror=e=>toast("音声入力エラー: "+e.error);
  speechRecognition.onend=()=>{speechRecognition=null;toast("音声入力を終了しました")};
  try{speechRecognition.start();toast("マイクに向かって話してください")}catch(e){toast("音声入力を開始できませんでした")}
}
$("attachButton").addEventListener("click",()=>$("fileInput").click());
$("chatTitleButton").addEventListener("click",()=>{});
$("fileInput").addEventListener("change",e=>{
  for(const f of e.target.files){if(attachedFiles.length<8)attachedFiles.push(f);else toast("一度に添付できるのは8ファイルまでです")}
  renderAttachedFiles();e.target.value="";
});
$("voiceButton").addEventListener("click",startVoiceInput);
$("send").addEventListener("click",sendWithAttachments);
// Replace the old Enter handler so the setting is respected.
$("prompt").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){
    e.stopImmediatePropagation();
    const shouldSend=appSettings.enterBehavior==="enter" ? !e.ctrlKey : e.ctrlKey;
    if(shouldSend){e.preventDefault();sendWithAttachments()}

},true);

// after lexical declaration, so the settings are also persisted and visible in the UI.
applyTheme();
